# 最小配置文件 - 用于首次启动和安装向导
# 系统将使用默认配置启动，并引导用户完成安装

debug: "release"

http:
  addr: ":8210"
  read_timeout: 10
  write_timeout: 10
  max_header_bytes: 20

swagger:
  title: "定时任务服务swagger API"
  desc: "这是一个简单的定时任务执行系统"
  host: "127.0.0.1:8210"
  base_path: ""

cors:
  allowed_origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8210,http://127.0.0.1:8210"

# 数据库配置 - 留空，将通过安装向导配置
db:
  engine: ""
  prefix: "sched_"

# 认证配置 - 将通过安装向导配置
auth:
  enable: true

# JWT配置 - 将通过安装向导配置
jwt:
  secret: "default_jwt_secret_change_me"
  expires: 7200