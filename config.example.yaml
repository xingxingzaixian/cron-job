# 定时任务管理系统配置文件示例
# 复制此文件为 config.yaml 并修改相应配置

debug: "debug"  # 运行模式: debug, release

http:
  addr: ":8210"           # 监听地址
  read_timeout: 10        # 读取超时时间(秒)
  write_timeout: 10       # 写入超时时间(秒)
  max_header_bytes: 20    # 最大请求头大小(MB)

swagger:
  title: "定时任务服务swagger API"
  desc: "这是一个简单的定时任务执行系统"
  host: "127.0.0.1:8210"
  base_path: ""

# CORS跨域配置
cors:
  # 允许的域名，多个用逗号分隔，* 表示允许所有域名（生产环境不建议使用）
  allowed_origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8210,http://127.0.0.1:8210"

# 数据库配置
db:
  # 数据库类型: mysql, postgresql (或 postgres), sqlite (或 sqlite3)
  engine: "mysql"
  host: "127.0.0.1"       # 数据库主机 (MySQL/PostgreSQL)
  port: 3306              # 数据库端口 (MySQL: 3306, PostgreSQL: 5432)
  name: "cronJob"         # 数据库名
  user: "root"            # 数据库用户名 (MySQL/PostgreSQL)
  password: "your_password_here"  # 数据库密码，建议使用环境变量 ${DB_PASSWORD}
  prefix: "sched_"        # 表前缀

  # 连接池配置 (MySQL/PostgreSQL)
  max_idle_conns: 10      # 最大空闲连接数
  max_open_conns: 100     # 最大打开连接数
  conn_max_lifetime: 3600 # 连接最大生存时间(秒)

# PostgreSQL 配置示例
# db:
#   engine: "postgresql"
#   host: "127.0.0.1"
#   port: 5432
#   name: "cronJob"
#   user: "postgres"
#   password: "your_password_here"
#   prefix: "sched_"
#   max_idle_conns: 10
#   max_open_conns: 100
#   conn_max_lifetime: 3600

# SQLite 配置示例
# db:
#   engine: "sqlite"
#   name: "cronJob"           # 数据库文件名（不含扩展名）
#   # path: "data/cronJob.db" # 或者直接指定完整路径
#   data_dir: "data"          # 数据库文件存储目录
#   prefix: "sched_"          # 表前缀
#
#   # SQLite 特定配置
#   sqlite:
#     synchronous: "NORMAL"   # 同步模式: OFF, NORMAL, FULL
#     cache_size: -64000      # 缓存大小（负数表示KB，正数表示页数）
#     temp_store: "MEMORY"    # 临时存储: DEFAULT, FILE, MEMORY
#     busy_timeout: 30000     # 忙等待超时时间（毫秒）

# 认证配置
auth:
  # 是否启用用户认证功能，false时系统将跳过所有用户认证和用户管理功能
  # 适用于只需要任务调度功能，不需要用户管理的场景
  enable: true

# JWT配置
jwt:
  secret: "your_jwt_secret_here"  # JWT密钥，建议使用环境变量 ${JWT_SECRET}
  expires: 7200                   # 过期时间(秒)
