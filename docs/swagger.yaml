definitions:
  global.TaskProtocol:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-varnames:
    - TaskProtocolHttp
    - TaskProtocolShell
    - TaskProtocolSSH
  global.TaskStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    type: integer
    x-enum-comments:
      TaskStatusCancel: 取消
      TaskStatusDisabled: 禁用
      TaskStatusEnabled: 启用
      TaskStatusFailure: 失败
      TaskStatusFinish: 成功
      TaskStatusRunning: 运行中
      TaskStatusTimeout: 超时
    x-enum-varnames:
    - TaskStatusDisabled
    - TaskStatusEnabled
    - TaskStatusFailure
    - TaskStatusRunning
    - TaskStatusFinish
    - TaskStatusCancel
    - TaskStatusTimeout
  schemas.AdminUserInput:
    properties:
      email:
        example: admin@example.com
        type: string
      nickname:
        example: 系统管理员
        type: string
      password:
        example: ""
        type: string
      username:
        example: admin
        type: string
    required:
    - nickname
    - password
    - username
    type: object
  schemas.CheckAuthOutput:
    properties:
      authEnabled:
        type: boolean
    type: object
  schemas.DatabaseTestInput:
    properties:
      engine:
        example: mysql
        type: string
      host:
        example: 127.0.0.1
        type: string
      name:
        example: cronJob
        type: string
      password:
        example: ""
        type: string
      path:
        example: ""
        type: string
      port:
        example: 3306
        type: integer
      user:
        example: root
        type: string
    required:
    - engine
    - name
    type: object
  schemas.DatabaseTestOutput:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  schemas.DelUserParams:
    properties:
      id:
        type: integer
    type: object
  schemas.InstallCheckOutput:
    properties:
      config_exists:
        type: boolean
      db_configured:
        type: boolean
      installed:
        type: boolean
    type: object
  schemas.InstallInput:
    properties:
      admin_user:
        $ref: '#/definitions/schemas.AdminUserInput'
      auth_enabled:
        example: true
        type: boolean
      database:
        $ref: '#/definitions/schemas.DatabaseTestInput'
      http_port:
        example: 8210
        type: integer
    required:
    - database
    type: object
  schemas.InstallOutput:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  schemas.LoginInput:
    properties:
      password:
        type: string
      userName:
        type: string
    required:
    - password
    - userName
    type: object
  schemas.LoginOutput:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/schemas.UserEditInput'
    type: object
  schemas.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  schemas.TaskLogDelete:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  schemas.TaskLogItemOutput:
    properties:
      endTime:
        description: 结束时间
        type: string
      id:
        type: integer
      protocol:
        allOf:
        - $ref: '#/definitions/global.TaskProtocol'
        description: 任务协议
      result:
        description: 执行结果
        type: string
      retryTimes:
        description: 任务重试次数
        type: integer
      startTime:
        description: 开始时间
        type: string
      status:
        allOf:
        - $ref: '#/definitions/global.TaskStatus'
        description: 状态 0:执行失败 1:执行中  2:执行完毕 3:任务取消(上次任务未执行完成) 4:异步执行
      taskId:
        description: 任务id
        type: integer
      taskName:
        description: 任务名称
        type: string
      totalTime:
        description: 执行总时长
        type: integer
    type: object
  schemas.TaskLogOutput:
    properties:
      list:
        items:
          $ref: '#/definitions/schemas.TaskLogItemOutput'
        type: array
      total:
        type: integer
    type: object
  schemas.TaskTestInput:
    properties:
      command:
        example: ""
        type: string
      params:
        example: ""
        type: string
      protocol:
        allOf:
        - $ref: '#/definitions/global.TaskProtocol'
        example: 1
      timeout:
        default: 0
        example: 30
        type: integer
    required:
    - command
    - protocol
    type: object
  schemas.TaskTestOutput:
    properties:
      duration_ms:
        type: integer
      error:
        type: string
      output:
        type: string
      size:
        type: integer
      status_code:
        type: integer
      success:
        type: boolean
    type: object
  schemas.UpdatePasswordInput:
    properties:
      confirmPassword:
        type: string
      newPass:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  schemas.UserEditInput:
    properties:
      email:
        example: ""
        type: string
      id:
        example: 1
        type: integer
      nickname:
        example: ""
        type: string
      password:
        example: ""
        type: string
      username:
        example: ""
        type: string
    type: object
  schemas.UserList:
    properties:
      list:
        items:
          $ref: '#/definitions/schemas.UserEditInput'
        type: array
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/check-auth:
    get:
      consumes:
      - application/json
      description: 获取是否启用认证
      operationId: /api/check-auth
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.CheckAuthOutput'
              type: object
      summary: 获取是否启用认证
      tags:
      - 登录
  /api/install/check:
    get:
      consumes:
      - application/json
      description: 检查系统是否已安装
      operationId: /api/install/check
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.InstallCheckOutput'
              type: object
      summary: 检查安装状态
      tags:
      - 安装
  /api/install/install:
    post:
      consumes:
      - application/json
      description: 执行系统安装，配置数据库和管理员账户
      operationId: /api/install/install
      parameters:
      - description: 安装配置
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/schemas.InstallInput'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.InstallOutput'
              type: object
      summary: 执行安装
      tags:
      - 安装
  /api/install/test-db:
    post:
      consumes:
      - application/json
      description: 测试数据库连接是否正常
      operationId: /api/install/test-db
      parameters:
      - description: 数据库配置
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/schemas.DatabaseTestInput'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.DatabaseTestOutput'
              type: object
      summary: 测试数据库连接
      tags:
      - 安装
  /api/login:
    post:
      consumes:
      - application/json
      description: 登录
      operationId: /api/login
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/schemas.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.LoginOutput'
              type: object
      summary: 登录
      tags:
      - 登录
  /api/task/test:
    post:
      consumes:
      - application/json
      description: 按当前表单配置同步执行一次，不保存任务
      parameters:
      - description: 测试任务配置
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/schemas.TaskTestInput'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.TaskTestOutput'
              type: object
      summary: 测试任务配置
      tags:
      - 任务
  /api/taskLog/clean:
    post:
      consumes:
      - application/json
      description: 按 log.retention_days 配置删除超过保留期的任务日志
      operationId: /api/taskLog/clean
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  type: integer
              type: object
      security:
      - ApiKeyAuth: []
      summary: 清理过期任务日志
      tags:
      - 任务日志管理
  /api/taskLog/delete:
    delete:
      consumes:
      - application/json
      description: 删除执行日志
      operationId: /api/taskLog/delete
      parameters:
      - description: 任务日志ID
        in: body
        name: ids
        required: true
        schema:
          $ref: '#/definitions/schemas.TaskLogDelete'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  type: boolean
              type: object
      security:
      - ApiKeyAuth: []
      summary: 删除执行日志
      tags:
      - 任务日志管理
  /api/taskLog/list:
    get:
      consumes:
      - application/json
      description: 任务执行日志列表
      operationId: /api/taskLog/list
      parameters:
      - description: 页数
        in: query
        name: pageNo
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      - description: 任务ID
        in: query
        name: taskId
        type: integer
      - description: 任务名称
        in: query
        name: taskName
        type: string
      - description: 任务状态
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.TaskLogOutput'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 任务执行日志列表
      tags:
      - 任务日志管理
  /api/taskLog/query:
    get:
      consumes:
      - application/json
      description: 任务执行日志
      operationId: /api/taskLog/query
      parameters:
      - description: 任务日志ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.TaskLogItemOutput'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 任务执行日志
      tags:
      - 任务日志管理
  /api/user/del:
    post:
      consumes:
      - application/json
      description: 删除用户
      operationId: /api/user/del
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/schemas.DelUserParams'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: 删除用户
      tags:
      - 用户管理
  /api/user/edit:
    post:
      consumes:
      - application/json
      description: 新增/修改用户
      operationId: /api/user/edit
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/schemas.UserEditInput'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: 新增/修改用户
      tags:
      - 用户管理
  /api/user/info:
    get:
      consumes:
      - application/json
      description: 我的信息
      operationId: /api/user/info
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.UserEditInput'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 我的信息
      tags:
      - 用户管理
  /api/user/list:
    get:
      consumes:
      - application/json
      description: 查询用户列表
      operationId: /api/user/list
      parameters:
      - description: 页数
        in: query
        name: pageNo
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      - description: 用户昵称
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.UserList'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询用户列表
      tags:
      - 用户管理
  /api/user/update-password:
    post:
      consumes:
      - application/json
      description: 更新密码
      operationId: /api/user/update-password
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdatePasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: 更新密码
      tags:
      - 用户管理
  /api/user/view:
    get:
      consumes:
      - application/json
      description: 用户信息
      operationId: /api/user/view
      parameters:
      - description: 用户ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/schemas.Response'
            - properties:
                data:
                  $ref: '#/definitions/schemas.UserEditInput'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 用户信息
      tags:
      - 用户管理
swagger: "2.0"
